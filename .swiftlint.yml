excluded:
  - moody.xcodeproj
  - moody/Assets.xcassets
  - DerivedData
  - build
  - .build

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - redundant_type_annotation

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - dx
    - dy
    - a
    - b
    - c

type_name:
  excluded:
    - moodyApp
    - moodyTests
    - moodyUITests

trailing_comma:
  mandatory_comma: true

large_tuple:
  warning: 3
  error: 4

reporter: "xcode"
