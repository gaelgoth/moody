<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>moody</title>
  <!-- Flattened copy of moody/AppIcon.icon (the source of truth); the glass is imitated. -->
  <style>
    .bg-top { stop-color: #FFFFFF; }
    .bg-bottom { stop-color: #F2F2F5; }
    @media (prefers-color-scheme: dark) {
      .bg-top { stop-color: #1C1C1E; }
      .bg-bottom { stop-color: #000000; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="bg-top"/>
      <stop offset="1" class="bg-bottom"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4F5E"/>
      <stop offset="1" stop-color="#FF7AB6"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A45CFF"/>
      <stop offset="1" stop-color="#4F7BFF"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB84D"/>
      <stop offset="1" stop-color="#FF6B8B"/>
    </linearGradient>
    <clipPath id="shape"><rect width="1024" height="1024" rx="232"/></clipPath>
    <clipPath id="photo"><rect x="348" y="298" width="328" height="428" rx="16"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Board dot grid -->
    <g fill="#8E8E93" fill-opacity="0.35">
      <circle cx="128" cy="128" r="9"/><circle cx="224" cy="128" r="9"/><circle cx="320" cy="128" r="9"/><circle cx="416" cy="128" r="9"/><circle cx="512" cy="128" r="9"/><circle cx="608" cy="128" r="9"/><circle cx="704" cy="128" r="9"/><circle cx="800" cy="128" r="9"/><circle cx="896" cy="128" r="9"/>
      <circle cx="128" cy="224" r="9"/><circle cx="224" cy="224" r="9"/><circle cx="320" cy="224" r="9"/><circle cx="416" cy="224" r="9"/><circle cx="512" cy="224" r="9"/><circle cx="608" cy="224" r="9"/><circle cx="704" cy="224" r="9"/><circle cx="800" cy="224" r="9"/><circle cx="896" cy="224" r="9"/>
      <circle cx="128" cy="320" r="9"/><circle cx="224" cy="320" r="9"/><circle cx="320" cy="320" r="9"/><circle cx="416" cy="320" r="9"/><circle cx="512" cy="320" r="9"/><circle cx="608" cy="320" r="9"/><circle cx="704" cy="320" r="9"/><circle cx="800" cy="320" r="9"/><circle cx="896" cy="320" r="9"/>
      <circle cx="128" cy="416" r="9"/><circle cx="224" cy="416" r="9"/><circle cx="320" cy="416" r="9"/><circle cx="416" cy="416" r="9"/><circle cx="512" cy="416" r="9"/><circle cx="608" cy="416" r="9"/><circle cx="704" cy="416" r="9"/><circle cx="800" cy="416" r="9"/><circle cx="896" cy="416" r="9"/>
      <circle cx="128" cy="512" r="9"/><circle cx="224" cy="512" r="9"/><circle cx="320" cy="512" r="9"/><circle cx="416" cy="512" r="9"/><circle cx="512" cy="512" r="9"/><circle cx="608" cy="512" r="9"/><circle cx="704" cy="512" r="9"/><circle cx="800" cy="512" r="9"/><circle cx="896" cy="512" r="9"/>
      <circle cx="128" cy="608" r="9"/><circle cx="224" cy="608" r="9"/><circle cx="320" cy="608" r="9"/><circle cx="416" cy="608" r="9"/><circle cx="512" cy="608" r="9"/><circle cx="608" cy="608" r="9"/><circle cx="704" cy="608" r="9"/><circle cx="800" cy="608" r="9"/><circle cx="896" cy="608" r="9"/>
      <circle cx="128" cy="704" r="9"/><circle cx="224" cy="704" r="9"/><circle cx="320" cy="704" r="9"/><circle cx="416" cy="704" r="9"/><circle cx="512" cy="704" r="9"/><circle cx="608" cy="704" r="9"/><circle cx="704" cy="704" r="9"/><circle cx="800" cy="704" r="9"/><circle cx="896" cy="704" r="9"/>
      <circle cx="128" cy="800" r="9"/><circle cx="224" cy="800" r="9"/><circle cx="320" cy="800" r="9"/><circle cx="416" cy="800" r="9"/><circle cx="512" cy="800" r="9"/><circle cx="608" cy="800" r="9"/><circle cx="704" cy="800" r="9"/><circle cx="800" cy="800" r="9"/><circle cx="896" cy="800" r="9"/>
      <circle cx="128" cy="896" r="9"/><circle cx="224" cy="896" r="9"/><circle cx="320" cy="896" r="9"/><circle cx="416" cy="896" r="9"/><circle cx="512" cy="896" r="9"/><circle cx="608" cy="896" r="9"/><circle cx="704" cy="896" r="9"/><circle cx="800" cy="896" r="9"/><circle cx="896" cy="896" r="9"/>
    </g>

    <!-- Photo stack -->
    <g filter="url(#shadow)">
      <rect x="312" y="262" width="400" height="500" rx="48" fill="url(#back)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4" transform="translate(-120 10) rotate(-20 512 512)"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="312" y="262" width="400" height="500" rx="48" fill="url(#middle)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4" transform="translate(118 -6) rotate(16 512 512)"/>
    </g>
    <g filter="url(#shadow)" transform="translate(0 26) rotate(-3 512 512)">
      <rect x="312" y="262" width="400" height="500" rx="48" fill="#FFFFFF"/>
      <g clip-path="url(#photo)">
        <rect x="348" y="298" width="328" height="428" fill="url(#sky)"/>
        <circle cx="580" cy="410" r="52" fill="#FFF3C4"/>
        <path d="M348 580 Q460 490 560 555 T676 535 V726 H348Z" fill="#8B5CF6"/>
        <path d="M348 650 Q480 585 676 665 V726 H348Z" fill="#4F46E5"/>
      </g>
    </g>
  </g>

  <!-- Glass rim; the dark hairline keeps the white icon's edge visible on white pages -->
  <rect x="1" y="1" width="1022" height="1022" rx="231" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
